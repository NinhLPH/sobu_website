<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e304e" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sobu-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.classList.add('light');
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta
      name="description"
      content="Khám phá mô hình sưu tầm, phụ kiện và dịch vụ dành cho collector tại SOBU."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SOBU - Mô hình sưu tầm & dịch vụ collector" />
    <meta property="og:description" content="Khám phá mô hình sưu tầm, phụ kiện và dịch vụ dành cho collector tại SOBU." />
    <meta property="og:site_name" content="SOBU" />
    <meta name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/assets/favicon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>SOBU - Mô hình sưu tầm &amp; dịch vụ collector</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
