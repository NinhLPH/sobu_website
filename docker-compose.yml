networks:
  sobu-network:
    driver: bridge

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: ${MYSQL_CONTAINER_NAME:-sobu-mysql}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - sobu-network

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-sobu-redis}
    restart: unless-stopped

    environment:
      TZ: Asia/Ho_Chi_Minh

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - sobu-network

  backend:
    image: ${BACKEND_IMAGE}
    container_name: ${BACKEND_CONTAINER_NAME:-sobu-backend}
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      TZ: Asia/Ho_Chi_Minh
      APP_STORAGE_LOCAL_DIR: /sobu/uploads
      SERVER_FORWARD_HEADERS_STRATEGY: framework

    env_file:
      - .env

    ports:
      - "${BACKEND_PORT:-8081}:${SERVER_PORT:-8081}"

    volumes:
      - uploads_data:/sobu/uploads

    networks:
      - sobu-network

volumes:
  mysql_data:
  redis_data:
  uploads_data:
