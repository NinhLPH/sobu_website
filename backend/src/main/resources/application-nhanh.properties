# ========================
# NHANH INTEGRATION PROFILE (optional)
# ========================
# Activate with SPRING_PROFILES_ACTIVE=nhanh to enable the Nhanh ERP integration.
# Without this profile the app runs in local mode (integration.nhanh.enabled=false)
# and none of the Nhanh schedulers, clients, OAuth routes, webhooks or sync jobs run.
integration.nhanh.enabled=true

# Credentials are required when this profile is active.
nhanh.client-id=${NHANH_CLIENT_ID}
nhanh.client-secret=${NHANH_CLIENT_SECRET}
nhanh.redirect-uri=${NHANH_REDIRECT_URI}
nhanh.business-id=${NHANH_BUSINESS_ID}

# ========================
# NHANH SYNC
# ========================
nhanh.base-url=${NHANH_BASE_URL:https://pos.open.nhanh.vn/api}
nhanh.sync.cron=${NHANH_SYNC_CRON:0 0 */12 * * *}
nhanh.sync.recovery.enabled=${NHANH_SYNC_RECOVERY_ENABLED:true}
nhanh.sync.recovery.initial-delay-ms=${NHANH_SYNC_RECOVERY_INITIAL_DELAY_MS:120000}
nhanh.sync.recovery.fixed-delay-ms=${NHANH_SYNC_RECOVERY_FIXED_DELAY_MS:300000}
nhanh.sync.recovery.batch-size=${NHANH_SYNC_RECOVERY_BATCH_SIZE:50}
nhanh.sync.recovery.max-retries=${NHANH_SYNC_RECOVERY_MAX_RETRIES:5}
nhanh.depot-id=${NHANH_DEPOT_ID:0}

# ========================
# NHANH WEBHOOKS
# ========================
nhanh.webhooks.verify-token=${NHANH_WEBHOOKS_VERIFYTOKEN:}

# ========================
# NHANH LOCATION
# ========================
nhanh.location.path=${NHANH_LOCATION_PATH:/v3.0/shipping/location}
nhanh.location.version=${NHANH_LOCATION_VERSION:v1}
nhanh.location.cache-ttl-hours=${NHANH_LOCATION_CACHE_TTL_HOURS:24}
nhanh.location.request-interval-ms=${NHANH_LOCATION_REQUEST_INTERVAL_MS:250}
nhanh.location.rate-limit-max-attempts=${NHANH_LOCATION_RATE_LIMIT_MAX_ATTEMPTS:5}
nhanh.location.rate-limit-unlock-buffer-seconds=${NHANH_LOCATION_RATE_LIMIT_UNLOCK_BUFFER_SECONDS:1}
nhanh.location.retry-after-seconds=${NHANH_LOCATION_RETRY_AFTER_SECONDS:30}
nhanh.location.rolling-window-ms=${NHANH_LOCATION_ROLLING_WINDOW_MS:30000}
nhanh.location.rolling-window-max-requests=${NHANH_LOCATION_ROLLING_WINDOW_MAX_REQUESTS:120}
nhanh.location.inter-chunk-sleep-ms=${NHANH_LOCATION_INTER_CHUNK_SLEEP_MS:0}
nhanh.location.chunk-size=${NHANH_LOCATION_CHUNK_SIZE:5}
nhanh.location.max-attempts-per-request=${NHANH_LOCATION_MAX_ATTEMPTS_PER_REQUEST:5}
nhanh.location.extended-lock-threshold-ms=${NHANH_LOCATION_EXTENDED_LOCK_THRESHOLD_MS:300000}
nhanh.location.retry-backoff-seconds=${NHANH_LOCATION_RETRY_BACKOFF_SECONDS:1,2,5}

# ========================
# NHANH SHIPPING
# ========================
nhanh.shipping.fee-path=${NHANH_SHIPPING_FEE_PATH:/v3.0/shipping/fee}
nhanh.shipping.type=${NHANH_SHIPPING_TYPE:1}
nhanh.shipping.carrier.id=${NHANH_SHIPPING_CARRIER_ID:29}
nhanh.shipping.carrier.standard-service=${NHANH_SHIPPING_CARRIER_STANDARD_SERVICE:186}
nhanh.shipping.carrier.express-service=${NHANH_SHIPPING_CARRIER_EXPRESS_SERVICE:187}
nhanh.shipping.carrier.express-carrier-id=${NHANH_SHIPPING_CARRIER_EXPRESS_CARRIER_ID:18}
nhanh.shipping.carrier.express-fallback-id=${NHANH_SHIPPING_CARRIER_EXPRESS_FALLBACK_ID:18}
nhanh.shipping.defaults.weight=${NHANH_SHIPPING_DEFAULT_WEIGHT:1000}
nhanh.shipping.origin.address=${NHANH_SHIPPING_ORIGIN_ADDRESS:}
nhanh.shipping.origin.city-id=${NHANH_SHIPPING_ORIGIN_CITY_ID:}
nhanh.shipping.origin.district-id=${NHANH_SHIPPING_ORIGIN_DISTRICT_ID:}
nhanh.shipping.origin.ward-id=${NHANH_SHIPPING_ORIGIN_WARD_ID:}

# ========================
# ACCOUNTING
# ========================
nhanh.accounting.account-id=${NHANH_ACCOUNTING_ACCOUNT_ID:0}
